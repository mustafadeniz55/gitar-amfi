name: APK derle

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # ubuntu-latest artık Ubuntu 26'ya geçti; Android SDK'lı bilinen sürümü sabitliyoruz.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle 8.7 kur
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Android lisanslarını kabul et
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Debug APK derle
        run: gradle --version && gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v5
        with:
          name: GitarAmfi-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
